      - name: Check honest Abyss boon choices, banking previews, actual input and legacy builds
        run: python3 tools/run_abyss_planning_checks.py
      - name: Check twin-stick aiming with production input, controls and saves
        run: python3 tools/run_controller_aim_checks.py
      - name: Check mentor sparring with production input, results and saves
        run: python3 tools/run_sparring_checks.py
      - name: Check Ada's freeform loadout range, real contacts, manual resets and safe saves
        run: python3 tools/run_range_checks.py
      - name: Check keyboard and controller range controls, paused records and stale-session safety
        run: python3 tools/run_range_control_checks.py
      - name: Check sand-skiff course preview, deliberate exits, real five-flag races and legacy records
        run: python3 tools/run_race_course_checks.py
      - name: Check guild story with production dialogue, chapters and saves
        run: python3 tools/run_guild_story_checks.py
      - name: Check expanded riverbank with production movement, interactions and saves
        run: python3 tools/run_reach_checks.py
      - name: Check cached riverbank shores, pixel seams, live bridge topology and legacy saves
        run: python3 tools/run_reach_shore_checks.py
      - name: Check viewport terrain, scenery continuity and fitted maps offline
        run: python3 tools/run_map_visibility_checks.py
      - name: Check discovered local waypoints, real map inputs, walking and save compatibility
        run: python3 tools/run_landmark_checks.py
      - name: Check explored gathering pins, real yields, quest return and legacy saves
        run: python3 tools/run_gathering_landmark_checks.py
      - name: Check charted material sources, original exchanges, deliberate map routing and legacy saves
        run: python3 tools/run_material_source_checks.py
      - name: Check source-specific map previews, deliberate arrival waypoints and original material interactions
        run: python3 tools/run_material_route_checks.py
      - name: Check interaction-aware routes, exact E targets, live gates and arrival hints
        run: python3 tools/run_interaction_route_checks.py
      - name: Check harbor tide countdowns, real sluice timing, unchanged crossings and legacy saves
        run: python3 tools/run_tide_forecast_checks.py
      - name: Check current climate protection, real heat and cold rates, danger thresholds and passive HUD
        run: python3 tools/run_climate_status_checks.py
      - name: Check accurate garden harvests, retained ripe crops, explicit spare seed returns and original stories
        run: python3 tools/run_garden_harvest_checks.py
      - name: Check live interaction hints, actual gathering and growth, safe prompt layout and unchanged inputs
