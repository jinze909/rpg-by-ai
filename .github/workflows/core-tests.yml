      - name: Check mature boss attack commitment with production input, warnings and saves
        run: python3 tools/run_boss_commitment_checks.py
      - name: Check announced boss volleys, real releases, terrain and HUD witnesses
        run: python3 tools/run_boss_volley_checks.py
      - name: Check real boss phase crossings, committed warnings, passive threshold marks and legacy saves
        run: python3 tools/run_boss_phase_cue_checks.py
      - name: Check Mira's homeward route with production input, combat and saves
        run: python3 tools/run_homeward_checks.py
      - name: Check saved battle plans and technique notes with production menus, sparring and saves
        run: python3 tools/run_battle_plan_checks.py
      - name: Check read-only battle plan stats, actual contacts and costs, menu comparison and legacy saves
        run: python3 tools/run_battle_plan_stats_checks.py
      - name: Check live talent growth comparisons, original point spending, actual combat values and legacy saves
        run: python3 tools/run_talent_growth_checks.py
      - name: Check reviewed talent refunds, deliberate confirmation, stale owners and legacy saves
        run: python3 tools/run_talent_reset_checks.py
      - name: Check reviewed town projects, exact costs, original facility benefits and safe confirmation
        run: python3 tools/run_town_project_checks.py
      - name: Check visible paid town projects, preserved scenery, walking and legacy saves
        run: python3 tools/run_project_scenery_checks.py
      - name: Check honest blacksmith quotes, free owned weapons, material shortfalls and legacy saves
        run: python3 tools/run_forge_quote_checks.py
      - name: Check selected weapon mastery, live milestones, read-only menus and legacy saves
        run: python3 tools/run_weapon_mastery_checks.py
      - name: Check honest relic forge quotes, actual payments, menu inputs and legacy saves
        run: python3 tools/run_relic_forge_checks.py
      - name: Check relic source trails and explicit quest routing
        run: python3 tools/run_relic_trail_checks.py
      - name: Check Ivo's commissioning trial with production input, warnings, daily supplies and saves
        run: python3 tools/run_commission_checks.py
      - name: Check Sen's shelter trail with production walking, wind, cold, dialogue and saves
        run: python3 tools/run_shelter_trail_checks.py
      - name: Check Ada's field notes with real weapon contacts, input, menus and saves
        run: python3 tools/run_fieldcraft_checks.py
