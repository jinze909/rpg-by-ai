name: Starfall core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize production actor masks and accepted hero repair sources
        run: git lfs pull --include="Assets/Resources/Frontier/Art/ActorMasks/*.png,Assets/ArtSource/Frontier/RepairMageBackIdle.png,Assets/ArtSource/Frontier/RepairMageRear.png,Assets/ArtSource/Frontier/RepairRangerSouth.png,Assets/ArtSource/Frontier/RepairVanguardWalk.png" --exclude=""
      - name: Check Unity metadata without rewriting assets
        run: python3 tools/check_unity_metadata.py && python3 -m unittest discover -s tests -p 'test_unity_metadata.py'
      - name: Check shipping Player compiler isolation without requiring a Unity SDK
        run: python3 -m unittest discover -s tests -p 'test_hero_unity_compile_plan.py'
      - name: Install Mono and image validation dependencies
        run: sudo apt-get update && sudo apt-get install -y mono-mcs python3-pil
      - name: Check authored-alpha projectile witness data without repainting effects
        run: python3 tools/bake_projectile_masks.py && python3 -m unittest discover -s tests -p 'test_projectile_masks.py'
      - name: Run actual C# gameplay checks
        run: python3 tools/run_core_tests.py
      - name: Check hero animation A-E offline gates and negative controls (not native acceptance)
        run: /usr/bin/python3 tools/check_hero_animation.py
      - name: Check production combat input with offline Unity declarations
        run: python3 tools/run_combat_input_checks.py
      - name: Check early dodge requests, real input priority, HUD and lifecycle cleanup
        run: python3 tools/run_dodge_buffer_checks.py
      - name: Check companion command notes, real release receipts and safe HUD feedback
        run: python3 tools/run_companion_tactics_checks.py
      - name: Check companion material routes, actual gathering, handoffs and save restoration
        run: python3 tools/run_companion_supply_checks.py
      - name: Check optional combat focus, real input, immutable attacks and safe lifecycle
        run: python3 tools/run_combat_focus_checks.py
      - name: Check explicit target cycling, immutable prepared aim and original focus controls
        run: python3 tools/run_combat_focus_cycle_checks.py
      - name: Check foreground threat contours, real damage boundaries and HUD visibility
        run: python3 tools/run_threat_contour_checks.py
      - name: Check directional projectile HUD witnesses, edge grazes and real contacts
        run: python3 tools/run_projectile_witness_checks.py
      - name: Check real staff and companion Starfire flight and fade alignment
        run: python3 tools/run_starfire_alignment_checks.py
      - name: Check real combat feedback text, stable lanes, clipping and lifetime cleanup
        run: python3 tools/run_combat_text_checks.py
      - name: Check actual player health loss, mitigated contacts, safe drills and readable loss feedback
        run: python3 tools/run_damage_taken_checks.py
      - name: Check actual combat healing, prepared contacts, honest stew receipts and green health feedback
        run: python3 tools/run_healing_feedback_checks.py
      - name: Check persistent enemy stun cues, real break windows and HUD visibility
        run: python3 tools/run_enemy_stun_checks.py
      - name: Check Heavy frontal armor, real contact states, direction and HUD visibility
        run: python3 tools/run_heavy_guard_checks.py
      - name: Check cached actor contact shadows, retained frames, HUD isolation and real combat
        run: python3 tools/run_contact_shadow_checks.py
      - name: Check continuous Boss cover, depth ordering, companion and HUD silhouettes
        run: python3 tools/run_boss_cover_checks.py
      - name: Check optional patrol story with production runtime and saves
        run: python3 tools/run_watch_quest_checks.py
      - name: Check optional Warden trial with production runtime and saves
        run: python3 tools/run_signal_warden_checks.py
      - name: Check voluntary Warden reprises, real combat records and persistent-world isolation
        run: python3 tools/run_signal_reprise_checks.py
      - name: Check road kitchen with production input, menus and saves
        run: python3 tools/run_kitchen_checks.py
      - name: Check batch supply quotes, actual preparation inputs, exact payment and legacy saves
        run: python3 tools/run_supply_preparation_checks.py
      - name: Check earned Hearth supper, real town and inn inputs, serving and persistent choices
        run: python3 tools/run_supper_checks.py
      - name: Check Tide Archive with production interactions, maps and saves
        run: python3 tools/run_archive_checks.py
      - name: Check earned first reply, real light handoff, permanent receipt and legacy saves
        run: python3 tools/run_return_letter_checks.py
      - name: Check journal pages while preserving all nineteen mature task rows
        run: python3 tools/run_journal_pagination_checks.py
      - name: Check optional Root Echo pulses, real input, unbanked rewards and six-floor preservation
        run: python3 tools/run_root_echo_checks.py
      - name: Check honest Abyss boon choices, banking previews, actual input and legacy builds
        run: python3 tools/run_abyss_planning_checks.py
      - name: Check twin-stick aiming with production input, controls and saves
        run: python3 tools/run_controller_aim_checks.py
      - name: Check mentor sparring with production input, results and saves
        run: python3 tools/run_sparring_checks.py
      - name: Check Ada's freeform loadout range, real contacts, manual resets and safe saves
        run: python3 tools/run_range_checks.py
      - name: Check guild story with production dialogue, chapters and saves
        run: python3 tools/run_guild_story_checks.py
      - name: Check expanded riverbank with production movement, interactions and saves
        run: python3 tools/run_reach_checks.py
      - name: Check cached riverbank shores, pixel seams, live bridge topology and legacy saves
        run: python3 tools/run_reach_shore_checks.py
      - name: Check viewport terrain, scenery continuity and fitted maps offline
        run: python3 tools/run_map_visibility_checks.py
      - name: Check discovered local waypoints, real map inputs, walking and save compatibility
        run: python3 tools/run_landmark_checks.py
      - name: Check interaction-aware routes, exact E targets, live gates and arrival hints
        run: python3 tools/run_interaction_route_checks.py
      - name: Check continuous scenery cover, companion visibility and real walking
        run: python3 tools/run_scenery_cover_checks.py
      - name: Check regional snow and dust, settings, pause and danger readability
        run: python3 tools/run_regional_air_checks.py
      - name: Check mature boss attack commitment with production input, warnings and saves
        run: python3 tools/run_boss_commitment_checks.py
      - name: Check Mira's homeward route with production input, combat and saves
        run: python3 tools/run_homeward_checks.py
      - name: Check saved battle plans and technique notes with production menus, sparring and saves
        run: python3 tools/run_battle_plan_checks.py
      - name: Check selected weapon mastery, live milestones, read-only menus and legacy saves
        run: python3 tools/run_weapon_mastery_checks.py
      - name: Check honest relic forge quotes, actual payments, menu inputs and legacy saves
        run: python3 tools/run_relic_forge_checks.py
      - name: Check Ivo's commissioning trial with production input, warnings, daily supplies and saves
        run: python3 tools/run_commission_checks.py
      - name: Check Sen's shelter trail with production walking, wind, cold, dialogue and saves
        run: python3 tools/run_shelter_trail_checks.py
      - name: Check Ada's field notes with real weapon contacts, input, menus and saves
        run: python3 tools/run_fieldcraft_checks.py
